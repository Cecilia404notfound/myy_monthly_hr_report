<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>集团人事月报归档</title>
  <style>
    :root{--bg:#f6f8fb;--panel:#ffffff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--shadow:0 10px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)} .wrap{max-width:1500px;margin:0 auto;padding:28px} .hero,.panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)} .hero{padding:24px} h1{margin:0;font-size:32px} .sub{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.8} .switch{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px} .switch button{border:1px solid var(--border);background:#fff;color:#334155;padding:10px 16px;border-radius:999px;font-size:14px;cursor:pointer} .switch button.active{background:#111827;color:#fff;border-color:#111827} .meta{margin-top:14px;color:var(--muted);font-size:13px} .panel{margin-top:18px;padding:16px} iframe{width:100%;height:calc(100vh - 240px);border:0;border-radius:16px;background:#fff} @media (max-width:860px){.wrap{padding:16px}h1{font-size:26px}iframe{height:72vh}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>集团人事月报归档</h1>
      <div class="sub">点击顶部月份即可切换查看对应月报，可在此处回溯查看。</div>
      <div class="switch"><button data-src="preview_refreshed_2026-03-31_v6.html">2026/3/31</button><button class="active" data-src="monthly_hr_report_2026-04-30.html">2026/4/30</button></div>
      <div class="meta" id="currentLabel">当前查看：2026/4/30</div>
    </div>
    <div class="panel"><iframe id="reportFrame" src="monthly_hr_report_2026-04-30.html" title="集团人事月报"></iframe></div>
  </div>
  <script>
    const frame=document.getElementById('reportFrame'); const label=document.getElementById('currentLabel');
    document.querySelectorAll('.switch button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.switch button').forEach(item=>item.classList.remove('active'));btn.classList.add('active');frame.src=btn.dataset.src;label.textContent=`当前查看：${btn.textContent}`;}));
  </script>
</body>
</html>
